<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Scrolls — Cultural Classics in Motion</title>
    <meta name="description" content="Discover cultural classics like The Kiss and The Scream in a TikTok-style reel feed for world-renowned masterpieces." />
    
    <!-- Tailwind CSS Engine for Stitches Utilities -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed": "#ffdea5",
              "on-tertiary-container": "#86847e",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e5e2e1",
              "outline-variant": "#c4c7c7",
              "surface-bright": "#fdf8f8",
              "surface-dim": "#ddd9d8",
              "background": "#fdf8f8",
              "primary": "#000000",
              "on-surface": "#1c1b1b",
              "surface-container-high": "#ebe7e6",
              "surface": "#fdf8f8",
              "surface-container": "#f1edec"
            },
            fontFamily: {
              "label-caps": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "headline-lg": ["Bodoni Moda", "serif"],
              "display-lg": ["Bodoni Moda", "serif"],
              "title-lg": ["Inter", "sans-serif"],
              "headline-md": ["Bodoni Moda", "serif"]
            }
          }
        }
      }

    <!-- Google Fonts: Bodoni Moda & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#1A1A1A] text-[#F9F7F2] font-sans antialiased overflow-x-hidden selection:bg-[#C5A059] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
